# Streamers to clip. Edit by hand or with /streamers in Discord.
#
# login:   Twitch username (from twitch.tv/<login>)
# name:    how the name appears in titles
# group:   streamers who often stream together; clips from the same group made
#          within 2 minutes of each other are treated as duplicates
# facecam: where the webcam sits, as fractions of the frame (0-1).
#          Leave null for the blurred-background layout.
#          Find it with:  python -m clipped_daily snapshot <login>
#          Example:       facecam: {x: 0.0, y: 0.0, w: 0.25, h: 0.3}
# allowed: set to false to pause a streamer without deleting them
# tags:    extra YouTube tags for this streamer (nicknames, what they're known for)

# Tags added to every streamer in a group
group_tags:
  amp: [amp, any means possible]

